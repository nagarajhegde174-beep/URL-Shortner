name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          cd backend
          mvn clean test

  frontend-test:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter (Oxlint)
        run: |
          cd frontend
          npm run lint

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-validate:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Dummy environment/.env
        run: |
          mkdir -p environment
          echo "JWT_SECRET=dummy-secret-key-min-32-chars-long-for-hs256-algo" > environment/.env
          echo "RAZORPAY_KEY_ID=dummy_id" >> environment/.env
          echo "RAZORPAY_KEY_SECRET=dummy_secret" >> environment/.env
          echo "RAZORPAY_WEBHOOK_SECRET=dummy_webhook" >> environment/.env

      - name: Verify Compose Configuration
        run: |
          docker compose config
