version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: dsa_studio_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dsa_studio
    ports:
      - "3306:3306"
    volumes:
      - dsa_studio_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  dsa_studio_data:
